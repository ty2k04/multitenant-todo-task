<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Tasks</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#1e293b;background:#eef2ff}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(720px,92vw);background:#fff;padding:2rem;border-radius:18px;box-shadow:0 18px 60px #3730a322}h1{margin-top:0;color:#312e81}input,button{font:inherit;padding:.7rem .8rem;border-radius:9px;border:1px solid #cbd5e1}input{width:100%;box-sizing:border-box;margin:.3rem 0 .8rem}.row{display:flex;gap:.6rem;align-items:center}.row input{margin:0}button{cursor:pointer;background:#4f46e5;color:#fff;border:0}button.secondary{background:#64748b}.hidden{display:none}.error{color:#b91c1c;min-height:1.5rem}li{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid #e2e8f0}li.done span{text-decoration:line-through;color:#64748b}li button{background:#dc2626;padding:.45rem .6rem}footer{color:#64748b;font-size:.8rem;margin-top:1.5rem}
</style></head>
<body><main>
<section id="auth"><h1>Shared Tasks WEBHOOKTEST</h1><p>Sign in to manage your own private todo list.</p><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><div class="row"><button id="login">Log in</button><button id="register" class="secondary">Create account</button></div><p id="auth-error" class="error"></p></section>
<section id="app" class="hidden"><div class="row" style="justify-content:space-between"><h1 id="welcome"></h1><button id="logout" class="secondary">Log out</button></div><div class="row"><input id="new-title" placeholder="Add a task"><button id="add">Add</button></div><p id="task-error" class="error"></p><ul id="todos"></ul><h2>Activity</h2><ul id="notifications"></ul></section>
<footer>Build __BUILD_TAG__</footer></main>
<script>
const state={token:localStorage.getItem('todo-token'),username:localStorage.getItem('todo-user')},$=id=>document.getElementById(id);
function showApp(){$('auth').classList.toggle('hidden',!!state.token);$('app').classList.toggle('hidden',!state.token);if(state.token){$('welcome').textContent=`Hi, ${state.username}`;refresh();}}
async function call(path,options={}){options.headers={'Content-Type':'application/json',...(state.token?{'Authorization':`Bearer ${state.token}`}:{}) ,...(options.headers||{})};const response=await fetch(path,options),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Request failed');return data;}
async function authenticate(path){try{const data=await call(path,{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});state.token=data.token;state.username=data.username;localStorage.setItem('todo-token',state.token);localStorage.setItem('todo-user',state.username);$('auth-error').textContent='';showApp();}catch(error){$('auth-error').textContent=error.message;}}
function escapeHtml(value){return value.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function refresh(){try{const todos=await call('/api/todos');$('todos').innerHTML=todos.map(t=>`<li class="${t.completed?'done':''}"><label><input type="checkbox" ${t.completed?'checked':''} onchange="toggleTodo(${t.id},this.checked)"> <span>${escapeHtml(t.title)}</span></label><button onclick="deleteTodo(${t.id})">Delete</button></li>`).join('')||'<li>No tasks yet.</li>';const notes=await call('/api/notifications');$('notifications').innerHTML=notes.map(n=>`<li>${escapeHtml(n.message)}</li>`).join('')||'<li>No activity yet.</li>';}catch(error){$('task-error').textContent=error.message;}}
async function addTodo(){try{await call('/api/todos',{method:'POST',body:JSON.stringify({title:$('new-title').value})});$('new-title').value='';refresh();}catch(error){$('task-error').textContent=error.message;}}
window.toggleTodo=async(id,completed)=>{await call(`/api/todos/${id}`,{method:'PATCH',body:JSON.stringify({completed})});refresh()};window.deleteTodo=async id=>{await call(`/api/todos/${id}`,{method:'DELETE'});refresh()};
$('login').onclick=()=>authenticate('/api/auth/login');$('register').onclick=()=>authenticate('/api/auth/register');$('add').onclick=addTodo;$('logout').onclick=()=>{localStorage.clear();state.token=null;showApp()};showApp();
</script></body></html>

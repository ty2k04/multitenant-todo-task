services:
  selenium:
    image: selenium/standalone-chrome:4.25.0-20241010
    shm_size: 2gb
    networks: [todo-net]

  ui-tests:
    build: ./ui-tests
    environment:
      APP_URL: http://proxy
      SELENIUM_URL: http://selenium:4444/wd/hub
    depends_on:
      proxy:
        condition: service_started
      selenium:
        condition: service_started
    networks: [todo-net]

networks:
  todo-net:
